version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      release-tooling:
        patterns: ["*"]
    ignore:
      # Major 10 needs conventional-changelog-writer 9, which release-notes-generator 14 does not
      # use yet. Remove once it does: the `release-notes` job of ci.yml proves the pair works.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
