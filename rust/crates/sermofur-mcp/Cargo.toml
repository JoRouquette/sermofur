[package]
name = "sermofur-mcp"
description = "Sermofur MCP: configuration editors and the stdio server (layer 8 of the Rust port)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sermofur-core = { path = "../sermofur-core" }
sermofur-daemon = { path = "../sermofur-daemon" }
# Decision A2 of John: tokio for the daemon and its clients; the bridge is one of them.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "rt"] }
