[package]
name = "sermofur-core"
description = "Sermofur core: domain, store, instance and memory services (layers 1 to 5 of the Rust port)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1.25"
sha2 = "0.11.1"
thiserror = "2"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"
