[package]
name = "smf"
description = "Sermofur command line (Rust port)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sermofur-core = { path = "../sermofur-core" }
sermofur-daemon = { path = "../sermofur-daemon" }
# Decision A2 of John: tokio for the daemon only (`smf daemon run`).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "signal"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
uuid = "1"
